<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial;
            background:#eee;
        }

        .box{
            display:flex;
        }

        .side{
            width:200px;
            height:100vh;
            background:#333;
            color:white;
            padding:20px;
        }

        .side h2{
            margin-bottom:30px;
        }

        .side p{
            padding:12px;
        }

        .side p:hover{
            background:#555;
        }

        .main{
            padding:25px;
            width:100%;
        }

        .top{
            display:flex;
            justify-content:space-between;
            margin-bottom:25px;
        }

        .cards{
            display:flex;
            gap:15px;
        }

        .card{
            background:white;
            padding:20px;
            width:23%;
            border-radius:5px;
        }

        .card h3{
            color:gray;
        }

        .card h2{
            margin:10px 0;
        }

        .orders{
            background:white;
            margin-top:25px;
            padding:20px;
        }

        table{
            width:100%;
            margin-top:15px;
            border-collapse:collapse;
        }

        th,td{
            padding:10px;
            text-align:left;
            border-bottom:1px solid #ddd;
        }

        .green{
            color:green;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="side">
        <h2>Dashboard</h2>
        <p>Home</p>
        <p>Users</p>
        <p>Products</p>
        <p>Orders</p>
        <p>Settings</p>
    </div>

    <div class="main">

        <div class="top">
            <div>
                <h1>Dashboard</h1>
                <p>Dashboard Overview</p>
            </div>

            <p>ANSH DAYAL</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Users</h3>
                <h2>1245</h2>
                <p class="green">+12%</p>
            </div>

            <div class="card">
                <h3>Products</h3>
                <h2>356</h2>
                <p class="green">+8%</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <h2>789</h2>
                <p class="green">+15%</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <h2>₹245000</h2>
                <p class="green">+24%</p>
            </div>

        </div>

        <div class="orders">

            <h2>Recent Orders</h2>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>35</td>
                    <td>Nitya</td>
                    <td>₹1200</td>
                    <td>Delivered</td>
                </tr>

                <tr>
                    <td>39</td>
                    <td>Priya</td>
                    <td>₹2500</td>
                    <td>Processing</td>
                </tr>

                <tr>
                    <td>07</td>
                    <td>Ananshi</td>
                    <td>₹800</td>
                    <td>Shipped</td>
                </tr>
            </table>

        </div>

    </div>

</div>

</body>
</html>
