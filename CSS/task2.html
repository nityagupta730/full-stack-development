<!DOCTYPE html>
<html>
<head>
    <title>ShopKart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #172033;
        }

     

        .navbar {
            height: 65px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: #2563eb;
            font-size: 20px;
            font-weight: bold;
        }

        .search {
            width: 300px;
            padding: 9px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .nav-icons {
            font-size: 18px;
        }

   

        .main {
            display: flex;
            gap: 25px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

       

        .sidebar {
            width: 210px;
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .sidebar h4 {
            margin-bottom: 8px;
            margin-top: 20px;
        }

        .sidebar label {
            display: block;
            margin: 8px 0;
            font-size: 14px;
            color: #555;
        }

        .filter-btn {
            width: 100%;
            padding: 9px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
        }


        .products {
            flex: 1;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top select {
            padding: 8px;
            border: 1px solid #ddd;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

       

        .card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        .product-img {
            height: 130px;
            background-color: #eef3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            border-radius: 5px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 16px;
            margin: 8px 0;
        }

        .price {
            font-weight: bold;
            font-size: 17px;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 12px;
        }

        .rating {
            color: orange;
            margin: 8px 0;
            font-size: 14px;
        }

        .cart {
            width: 100%;
            padding: 9px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .cart:hover {
            background-color: #1d4ed8;
        }

        .badge {
            background-color: #22c55e;
            color: white;
            font-size: 11px;
            padding: 4px 7px;
            border-radius: 4px;
        }

        .sale {
            background-color: #ef4444;
        }


        .menu {
            display: none;
        }

        /* Tablet */

        @media (max-width: 900px) {

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .search {
                width: 220px;
            }
        }

      

        @media (max-width: 600px) {

            .navbar {
                padding: 0 15px;
            }

            .search,
            .nav-icons {
                display: none;
            }

            .menu {
                display: block;
                font-size: 22px;
            }

            .main {
                flex-direction: column;
                margin-top: 20px;
            }

            .sidebar {
                width: 100%;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

    </style>
</head>

<body>


    <div class="navbar">

        <div class="logo">
            🛍 ShopKart
        </div>

        <input
            class="search"
            type="text"
            placeholder="Search products..."
        >

        <div class="nav-icons">
            🛒 &nbsp; 👤
        </div>

        <div class="menu">
            ☰
        </div>

    </div>


    

    <div class="main">


        <div class="sidebar">

            <h3>Filters</h3>

            <h4>Category</h4>

            <label>
                <input type="checkbox"> Laptops
            </label>

            <label>
                <input type="checkbox"> Tablets
            </label>

            <label>
                <input type="checkbox"> Accessories
            </label>

            <h4>Price</h4>

            <label>
                <input type="radio" name="price">
                ₹0 - ₹20,000
            </label>

            <label>
                <input type="radio" name="price">
                ₹20,000 - ₹50,000
            </label>

            <label>
                <input type="radio" name="price">
                ₹50,000+
            </label>

            <h4>Brand</h4>

            <label>
                <input type="checkbox"> Dell
            </label>

            <label>
                <input type="checkbox"> HP
            </label>

            <label>
                <input type="checkbox"> Lenovo
            </label>

            <button class="filter-btn">
                Apply Filters
            </button>

        </div>



        <div class="products">

            <div class="top">

                <p>Showing 6 products</p>

                <select>
                    <option>Sort by</option>
                    <option>Price Low to High</option>
                    <option>Price High to Low</option>
                </select>

            </div>


            <div class="product-grid">



                <div class="card">

                    <span class="badge sale">SALE</span>

                    <div class="product-img">
                        💻
                    </div>

                    <h3>Dell Inspiron 15</h3>

                    <div class="price">
                        ₹45,990
                        <span class="old-price">
                            ₹49,990
                        </span>
                    </div>

                    <div class="rating">
                        ★★★★★
                    </div>

                    <button class="cart">
                        Add to Cart
                    </button>

                </div>



                <div class="card">

                    <span class="badge">NEW</span>

                    <div class="product-img">
                        💻
                    </div>

                    <h3>HP Pavilion</h3>

                    <div class="price">
                        ₹52,990
                    </div>

                    <div class="rating">
                        ★★★★☆
                    </div>

                    <button class="cart">
                        Add to Cart
                    </button>

                </div>


     

                <div class="card">

                    <div class="product-img">
                        💻
                    </div>

                    <h3>Lenovo IdeaPad</h3>

                    <div class="price">
                        ₹38,990
                    </div>

                    <div class="rating">
                        ★★★★★
                    </div>

                    <button class="cart">
                        Add to Cart
                    </button>

                </div>


  

                <div class="card">

                    <div class="product-img">
                        💻
                    </div>

                    <h3>MacBook Air M2</h3>

                    <div class="price">
                        ₹79,990
                    </div>

                    <div class="rating">
                        ★★★★★
                    </div>

                    <button class="cart">
                        Add to Cart
                    </button>

                </div>


        

                <div class="card">

                    <span class="badge">NEW</span>

                    <div class="product-img">
                        💻
                    </div>

                    <h3>ASUS Vivobook</h3>

                    <div class="price">
                        ₹43,700
                    </div>

                    <div class="rating">
                        ★★★★☆
                    </div>

                    <button class="cart">
                        Add to Cart
                    </button>

                </div>


            

                <div class="card">

                    <div class="product-img">
                        💻
                    </div>

                    <h3>Dell XPS 13</h3>

                    <div class="price">
                        ₹69,990
                    </div>

                    <div class="rating">
                        ★★★★★
                    </div>

                    <button class="cart">
                        Add to Cart
                    </button>

                </div>


            </div>

        </div>

    </div>

</body>
</html>
